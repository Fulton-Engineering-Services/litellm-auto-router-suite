version: 2

# One grouped PR per ecosystem, weekly. Actions pins stay SHA-pinned: Dependabot
# resolves the commit SHA itself and rewrites both the SHA and its trailing
# human-tag comment, so the "never a mutable tag" rule in the workflows survives
# automation.

updates:
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # `typescript` is pinned to ~6.0.3 deliberately: typescript-eslint 8.72.2
    # declares peer `>=4.8.4 <6.1.0` and its parser throws "typescript-eslint
    # does not support TS 7.0", which is exactly what the lint:tsdoc gate runs.
    # Dependabot rewrites the requirement, not just the lockfile, so a 7.x
    # proposal would redden the required `TypeScript` check -- and with strict
    # required checks that freezes every subsequent PR. Only >=7 is held back,
    # so 6.0.x patches (including security ones) still arrive. When a
    # typescript-eslint release admits TS 7, bump both together and drop this.
    ignore:
      - dependency-name: typescript
        versions:
          - '>= 7'
    groups:
      typescript:
        patterns:
          - '*'

  # uv.lock is covered by the pip ecosystem.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /docker/images/harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - '*'

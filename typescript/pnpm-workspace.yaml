packages:
  - packages/*

# pnpm 12 rejects dependencies published inside its minimumReleaseAge window, which
# would fail `pnpm install --frozen-lockfile` (and therefore every CI run) for as long
# as these exact builds are younger than the cutoff. Each entry below names a version
# this repo deliberately pins — the oxlint/oxlint-tsgolint matched pair and the
# typescript-eslint line the TSDoc gate needs. The policy stays on for everything else,
# and these lines go inert once the builds age out.
minimumReleaseAgeExclude:
  - '@oxlint/binding-android-arm-eabi@1.93.0'
  - '@oxlint/binding-android-arm64@1.93.0'
  - '@oxlint/binding-darwin-arm64@1.93.0'
  - '@oxlint/binding-darwin-x64@1.93.0'
  - '@oxlint/binding-freebsd-x64@1.93.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.93.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.93.0'
  - '@oxlint/binding-linux-arm64-gnu@1.93.0'
  - '@oxlint/binding-linux-arm64-musl@1.93.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.93.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.93.0'
  - '@oxlint/binding-linux-riscv64-musl@1.93.0'
  - '@oxlint/binding-linux-s390x-gnu@1.93.0'
  - '@oxlint/binding-linux-x64-gnu@1.93.0'
  - '@oxlint/binding-linux-x64-musl@1.93.0'
  - '@oxlint/binding-openharmony-arm64@1.93.0'
  - '@oxlint/binding-win32-arm64-msvc@1.93.0'
  - '@oxlint/binding-win32-ia32-msvc@1.93.0'
  - '@oxlint/binding-win32-x64-msvc@1.93.0'
  - '@typescript-eslint/parser@8.72.2'
  - '@typescript-eslint/project-service@8.72.2'
  - '@typescript-eslint/scope-manager@8.72.2'
  - '@typescript-eslint/tsconfig-utils@8.72.2'
  - '@typescript-eslint/types@8.72.2'
  - '@typescript-eslint/typescript-estree@8.72.2'
  - '@typescript-eslint/visitor-keys@8.72.2'
  - oxlint@1.93.0
strictDepBuilds: false
verifyDepsBeforeRun: false
